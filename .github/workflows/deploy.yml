name: Deploy UFLMB to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check security contracts
        run: npm run check:security
      - name: Audit production card data
        run: node scripts/check-card-data.mjs
      - name: Build production site
        env:
          VITE_SUPABASE_URL: https://ujuptqzlpubcdelrjmja.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_mI4mGppqhAbG3T2H3b7z3Q_PK09LaD_
        run: npm run build
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
