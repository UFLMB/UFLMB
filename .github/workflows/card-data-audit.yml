name: Scheduled card-data quality audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production source dataset
        run: node scripts/check-card-data.mjs
      - name: Audit shared source freshness and link reachability
        env:
          VITE_SUPABASE_URL: https://ujuptqzlpubcdelrjmja.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_mI4mGppqhAbG3T2H3b7z3Q_PK09LaD_
        run: node scripts/audit-shared-sources.mjs
