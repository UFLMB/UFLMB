name: Deploy UFLMB to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check security contracts
        run: npm run check:security

      - name: Audit production card data
        run: node scripts/check-card-data.mjs

      - name: Syntax-check shared source audit
        run: node --check scripts/audit-shared-sources.mjs

      - name: Build Firebase site
        env:
          VITE_SUPABASE_URL: https://ujuptqzlpubcdelrjmja.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_mI4mGppqhAbG3T2H3b7z3Q_PK09LaD_
          VITE_SITE_URL: https://uflmb.web.app/
          VITE_CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN_FIREBASE }}
        run: npm run build:firebase

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UFLMB_HOSTING }}
          projectId: uflmb-hosting
          target: uflmb
          channelId: live
