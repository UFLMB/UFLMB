name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check security contracts
        run: npm run check:security
      - name: Audit production card data
        run: node scripts/check-card-data.mjs
      - name: Syntax-check shared source audit
        run: node --check scripts/audit-shared-sources.mjs
      - name: Type-check and build
        run: npm run build
