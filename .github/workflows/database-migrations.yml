name: Validate Supabase migrations

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-migrations.yml'

permissions:
  contents: read

concurrency:
  group: database-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start
      - name: Replay all migrations on a clean local database
        run: supabase db reset
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
