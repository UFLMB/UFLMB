<!doctype html>
<html lang="en" data-ui-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function () {
        var key = 'uflmb.ui-theme-mode.v4';
        var mode = 'dark';
        try {
          var saved = window.localStorage.getItem(key);
          if (saved === 'dark' || saved === 'light' || saved === 'system') mode = saved;
        } catch (error) {}
        var resolved = mode === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : mode;
        document.documentElement.setAttribute('data-ui-theme', resolved);
        document.documentElement.style.colorScheme = resolved;
        var colorScheme = document.querySelector('meta[name="color-scheme"]');
        if (colorScheme) colorScheme.setAttribute('content', resolved);
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute('content', resolved === 'light' ? '#f4f6f8' : '#0b0d12');
      })();
    </script>
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="Explore the UFL Mobile card reference: searchable player cards, OVR ratings, positions, stats, traits and verified sources." />
    <meta name="application-name" content="UFLMB" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UFLMB" />
    <meta property="og:title" content="UFLMB — UFL Mobile Card Database" />
    <meta property="og:description" content="A community-built reference for UFL Mobile player cards, ratings, stats and verified sources." />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="UFLMB — UFL Mobile Card Database" />
    <meta name="twitter:description" content="Search UFL Mobile player cards, compare ratings and explore verified card details." />
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" /></noscript>
    <style id="uflmb-critical-css">
      :root{font-family:Manrope,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f3f5f8;background:#0b0d12;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;--muted:#9299a8;--line:rgba(255,255,255,.09);--lime:#c5f467;--panel:#11141b}
      *{box-sizing:border-box}
      html,body{margin:0;min-width:320px;min-height:100%;background:#0b0d12}
      body{min-height:100vh;color:#f3f5f8}
      button,a{font:inherit}button,a{cursor:pointer}a{color:inherit}
      .app-shell{width:min(1120px,calc(100% - 48px));margin:0 auto}
      .topbar{position:relative;z-index:20;min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line)}
      .brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;flex-shrink:0}
      .brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--lime);color:#11150a;font-size:20px;font-weight:800;transform:skew(-5deg)}
      .brand-word{font-size:19px;font-weight:800;letter-spacing:-.8px}.brand-word span{color:var(--lime)}
      .site-nav{display:flex;align-items:center;justify-content:center;gap:5px;flex:1;min-width:0}
      .home-page{display:grid;gap:20px;padding:26px 0 34px}
      .home-hero{position:relative;overflow:hidden;padding:clamp(24px,5vw,48px);border:1px solid rgba(197,244,103,.16);border-radius:20px;background:radial-gradient(ellipse at 80% 10%,rgba(197,244,103,.14),transparent 42%),linear-gradient(135deg,rgba(24,29,38,.94),rgba(11,14,20,.93));box-shadow:0 16px 44px rgba(0,0,0,.16)}
      .eyebrow{margin:0 0 17px;color:var(--lime);font-family:"DM Mono",monospace;font-size:10px;letter-spacing:2.2px}
      .home-hero h1{margin:9px 0 13px;font-size:clamp(36px,6vw,64px);line-height:.99;letter-spacing:-2.8px;font-weight:800}
      .home-hero h1 span{color:var(--lime)}
      .hero-copy{max-width:620px;margin:23px 0 30px;color:var(--muted);font-size:15px;line-height:1.8}
      .home-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
      .button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:9px;padding:10px 13px;font-size:12px;font-weight:700;text-decoration:none}
      .button.primary{background:var(--lime);color:#151a0c}.button.secondary{background:#1b202a;border-color:var(--line);color:#e5e8ee}
      .home-overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
      .home-overview article{min-width:0;display:grid;gap:7px;padding:17px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(17,20,27,.78)}
      @media(max-width:650px){.app-shell{width:calc(100% - 32px)}.topbar{min-height:70px}.home-page{gap:12px;padding:15px 0 24px}.home-actions{display:grid;grid-template-columns:1fr}.home-actions .button{width:100%;min-height:44px;justify-content:center}.home-overview{grid-template-columns:1fr}}
      :root[data-ui-theme="light"]{color:#18202b;background:#f4f6f8;--muted:#657181;--line:rgba(24,32,43,.12);--panel:#fff}
      :root[data-ui-theme="light"] body, :root[data-ui-theme="light"] html{background:#f4f6f8;color:#18202b}
    </style>
    <link rel="ard" type="application/json" href="%BASE_URL%.well-known/ard.json" />
    <link rel="ai-catalog" type="application/ai-catalog+json" href="%BASE_URL%.well-known/ai-catalog.json" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>UFLMB — UFL Mobile Card Database</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
